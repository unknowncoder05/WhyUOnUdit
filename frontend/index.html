<!DOCTYPE html>
<html lang ="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>WhyUOn</title>
        <link rel="stylesheet" href="css/style.css"
    </head>
    <body>
        <h1>WHYUON</h1>
        <p>Desafio 1 </p>
            <section class="perfiles">
                <!--Tarjeta de usuario de whyuon-->
                <article class="card">
                    <!--Imagen de fondo de recuadro de usuario de whyuon-->
                    <div class="card__banner">
                        <img src="img\evasiontv_banner.jpg" alt="">  
                    </div>
                    <!---foto de perfil de whyuon-->
                    <img class="card__avatar" src="img\evasiontv_logo.jpg" alt="">
                    <!--info del usuario-->
                    <div class="card__body">
                        <h2 class="card__username">@evasiontvplay</h2>
                        <p class="card__desc">Evasión TV es el canal de contenido outdoor de referencia. Sigue las mejores carreras por montaña en directo y no te pierdas entrevistas a los mejores profesionales del deporte. </p>
                        <!--plataformas del usuario-->
                        <ul class="card__platforms">
                            <li><a href="https://www.youtube.com/@evasiontvplay">Youtube</a></li>                                                       
                            <li><a href="evasiontv.es">Blog</a></li>
                        </ul>
                    </div>
                </article>

                <!--repetir para cada usuario-->

            </section>

    </body>
</html>
